name: Portfolio demo tests

on:
  push:
    paths:
      - "demo/**"
      - ".github/workflows/demo-tests.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run demo unit tests
        run: python -m unittest demo.test_evidence_reuse_demo

      - name: Run sample classification
        run: python demo/evidence_reuse_demo.py demo/sample_change.json demo/sample_evidence.json
